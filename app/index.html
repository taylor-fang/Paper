  });

  // after the browser's own small edits (typing, deleting inside a to-do), read the words back
  list.addEventListener('input', () => {
    const items = [...list.children];
    if (items.length !== todos.length || items.some((li) => !li.querySelector('.text'))) {
      const at = todoSel();
      todos = items.map((li) => ({ t: (li.querySelector('.text') || li).textContent.replace(/\n+$/, ''), d: li.classList.contains('done') }));
      renderTodos();
      if (at && list.children[at.a.i]) setTodoSel(at.a);
    } else {
      items.forEach((li, k) => {
        const text = li.querySelector('.text');
        if (!text.querySelector(':scope > br:last-child')) text.append(document.createElement('br'));
        const t = text.textContent.replace(/\n+$/, '');
        if (t !== todos[k].t) { todos[k].t = t; strikeThrough(li); }
      });
    }
    saveTodos();
  });

  function copyTodos(e, cut) {
    const sel = todoSel();
    if (!sel || sel.collapsed) return;
    e.preventDefault();
    e.clipboardData.setData('text/plain', selectedText(sel));
    if (cut) { remember(); cutSpan(sel.a, sel.b); redraw(sel.a); }
  }
  list.addEventListener('copy', (e) => copyTodos(e, false));
  list.addEventListener('cut', (e) => copyTodos(e, true));
  list.addEventListener('keydown', (e) => {
    // ⌘-enter ticks the to-do (or all the selected ones)
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      const sel = todoSel();
      if (sel) toggleDone(sel.a.i);
    }
  });

  /* ================= footnotes (⌘⌥F) ================= */
  const fnLayer = $('fnotes');
  const FN_GAP = 48, FN_WIDE = 220, FN_NARROWEST = 110; // margin notes: gap from the writing, widest, narrowest beside it
  // number the references in order, give each its note in the margin, and drop notes whose reference is gone
  function layoutNotes() {
    const refs = [...ed.querySelectorAll('sup.fn')];
    const kept = new Set();
    refs.forEach((ref, k) => {
      if (!ref.dataset.id) ref.dataset.id = 'f' + Math.random().toString(36).slice(2, 8);
      ref.dataset.n = String(k + 1);
      const after = ref.nextSibling;
      if (!after || after.nodeType !== 3) ref.after(document.createTextNode('\u200b'));
      if (ref.textContent !== ref.dataset.n) ref.textContent = ref.dataset.n;
      ref.contentEditable = 'false';
      ref.title = ref.dataset.note || '';
      kept.add(ref.dataset.id);
      let note = fnLayer.querySelector(`[data-id="${ref.dataset.id}"]`);
      if (!note) note = makeNote(ref);
      note.querySelector('.n').textContent = (k + 1) + '.';
      const body = note.querySelector('.body');
      const html = noteHtml(ref.dataset.note || '');
      if (document.activeElement !== body && body.innerHTML !== html) body.innerHTML = html;
    });
    for (const note of [...fnLayer.children]) if (!kept.has(note.dataset.id)) note.remove();
    placeNotes(refs);
  }
  function makeNote(ref) {
    const id = ref.dataset.id;
    const note = document.createElement('div');
    note.className = 'fnote';
    note.dataset.id = id;
    note.innerHTML = '<span class="n"></span><span class="body"></span>';
    const body = note.querySelector('.body');
    body.contentEditable = 'true'; // ⌘B, ⌘I and ⌘U work in notes too
    // Safari can lose track of where an emptied note is and scroll to the top of the page: hold the page still
    let heldAt = null;
    const hold = () => { heldAt = [scrollX, scrollY]; };
    body.addEventListener('keydown', hold);
    body.addEventListener('beforeinput', hold);
    body.addEventListener('focus', hold);
    body.addEventListener('input', () => {
      const at = heldAt;
      if (!at) return;
      const back = () => { if (Math.abs(scrollY - at[1]) > 2 || Math.abs(scrollX - at[0]) > 2) scrollTo(at[0], at[1]); };
      back();
      requestAnimationFrame(back);
    });
    body.addEventListener('focus', () => requestAnimationFrame(() => { if (heldAt && Math.abs(scrollY - heldAt[1]) > 2) scrollTo(heldAt[0], heldAt[1]); }));

    body.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = e.clipboardData.getData('text/plain');

    body.setAttribute('writingsuggestions', 'false');

      if (r) { r.dataset.note = noteHtml(body.innerHTML); r.title = body.textContent; }

      saveDoc();
    };

      if ((e.key === 'Enter' && !e.shiftKey) || e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); backToText(id); }

      layoutNotes();
      recount();
      saveDoc();

    note.onmouseleave = () => lightNote(id, false);

  }

  // Older notes were plain text, and some came from markdown with *marks*; both become formatting
  function noteHtml(raw) {
    const box = document.createElement('div');
    if (!/<[a-z]/i.test(raw)) box.innerHTML = fromMarkdownInline(raw);
    else box.innerHTML = raw;
    for (const el of [...box.querySelectorAll('*')]) {
      if (!el.isConnected) continue;
      const tag = el.nodeName === 'STRONG' ? 'B' : el.nodeName === 'EM' ? 'I' : el.nodeName;
      if (!/^(B|I|U|S|A)$/.test(tag)) { el.replaceWith(...el.childNodes); continue; }
      if (tag !== el.nodeName) { const n = document.createElement(tag); n.append(...el.childNodes); el.replaceWith(n); continue; }

  }
  function lightNote(id, on) {
    ed.querySelector(`sup.fn[data-id="${id}"]`)?.classList.toggle('lit', on);

  }
  ed.addEventListener('mouseover', (e) => { const r = e.target.closest?.('sup.fn'); if (r) lightNote(r.dataset.id, true); });
  ed.addEventListener('mouseout', (e) => { const r = e.target.closest?.('sup.fn'); if (r) lightNote(r.dataset.id, false); });
  // a triple-click selects the whole paragraph, past any footnote numbers in it
  ed.addEventListener('mousedown', (e) => {
    if (e.detail < 3 || e.button !== 0) return;
    const block = e.target.closest?.('p, li');
    if (!block || !ed.contains(block)) return;
    e.preventDefault();
    placeCaret((x) => x.selectNodeContents(block));
  });
  // backspace just after a footnote number (or delete just before it) removes the footnote
  function footnoteBeside(r, back) {
    let n = r.startContainer, o = r.startOffset, x;

  }

  // each note in the margin, level with the line its number is on, moved down if it would
  // overlap the one above. The writing stays where it is; the notes take the room to its right,
  // up to 220px, narrower as the window narrows, and under the writing when there's no room at all
  function placeNotes(refs = [...ed.querySelectorAll('sup.fn')]) {
    if (!refs.length) return;
    const column = (s.paper === 'sheet' ? $('page') : $('lines')).getBoundingClientRect();
    const left = column.right + FN_GAP;
    const room = innerWidth - left - 56; // leave the right edge to the S
    const width = Math.min(FN_WIDE, room);
    const beside = width >= FN_NARROWEST;
    const lh = parseFloat(getComputedStyle(ed).lineHeight) || 20;
    const fs = parseFloat(getComputedStyle(ed).fontSize);
    let floor = -Infinity;
    for (const ref of refs) {
      const note = fnLayer.querySelector(`[data-id="${ref.dataset.id}"]`);
      if (!note) continue;
      if (beside) {
        const r = document.createRange();
        r.setStartBefore(ref);
        r.collapse(true);
        const at = r.getClientRects()[0] || ref.getBoundingClientRect();
        // the note's first line sits on the same baseline as the writing's
        const y = Math.max(at.top + scrollY + (lh - fs) / 2 + fs * .8 - 13 * .95, floor);
        note.style.cssText = `left:${left + scrollX}px;top:${y}px;width:${width}px`;
        floor = y + note.offsetHeight + 10;
      } else {
        const text = $('lines').getBoundingClientRect();
        const y = Math.max(ed.getBoundingClientRect().bottom + scrollY + 28, floor);
        note.style.cssText = `left:${text.left + scrollX}px;top:${y}px;width:${text.width}px`;
        floor = y + note.offsetHeight + 8;
      }
    }
  }

  // ⌘⌥F: a footnote where the cursor is, and straight into writing it
  function addFootnote() {
    const sel = getSelection();
    if (!sel.rangeCount || !ed.contains(sel.anchorNode)) return;
    const r = sel.getRangeAt(0);
    r.collapse(false);
    const ref = document.createElement('sup');
    ref.className = 'fn';
    ref.contentEditable = 'false';
    ref.dataset.id = 'f' + Math.random().toString(36).slice(2, 8);
    ref.dataset.note = '';
    r.insertNode(ref);
    layoutNotes();
    saveDoc();
    const body = fnLayer.querySelector(`[data-id="${ref.dataset.id}"] .body`);
    body.focus({ preventScroll: true });
    caretJumped = true;
    drawCaret();
  }

  // a selection of nothing but one footnote number is drawn snug around the number
  document.addEventListener('selectionchange', () => {
    const sel = getSelection();
    let only = null;
    if (sel.rangeCount && !sel.isCollapsed && ed.contains(sel.anchorNode)) {
      const r = sel.getRangeAt(0);
      const refs = [...ed.querySelectorAll('sup.fn')].filter((x) => r.intersectsNode(x));
      if (refs.length === 1 && r.toString().trim() === refs[0].textContent) only = refs[0];
    }
    ed.querySelectorAll('sup.fn.picked').forEach((x) => { if (x !== only) x.classList.remove('picked'); });
    only?.classList.add('picked');
  });

  // copying keeps footnotes: the number travels with its note, and pastes back as a footnote
  // copying always writes the clipboard itself, so other apps get the formatting and the empty lines:
  // rich text with bold, italic, underline, strikethrough, links and lists, and every empty line as one;
  // plain text with a line per paragraph and the empty lines kept. Footnotes travel with their notes
  function copyFromPage(e, cut) {
    const sel = getSelection();
    if (!sel.rangeCount || sel.isCollapsed || !ed.contains(sel.anchorNode)) return;
    const r = sel.getRangeAt(0);
    const box = document.createElement('div');
    const c = r.commonAncestorContainer;
    const inside = (c.nodeType === 1 ? c : c.parentElement).closest('sup.fn');
    box.append(inside ? inside.cloneNode(true) : r.cloneContents()); // just the number: the whole footnote
    // a part of one paragraph keeps the formatting it sits in (bold, italic, a link…)
    if (!inside && !box.querySelector('p, li, ul, ol')) {
      for (let n = (c.nodeType === 1 ? c : c.parentElement); n && n !== ed && !/^(P|LI)$/.test(n.nodeName); n = n.parentElement) {
        if (/^(B|STRONG|I|EM|U|S|STRIKE|DEL|A)$/.test(n.nodeName)) {
          const w = n.cloneNode(false);
          w.append(...box.childNodes);
          box.append(w);
        }
      }
    }
    for (const x of box.querySelectorAll('sup.fn')) { x.removeAttribute('data-id'); x.removeAttribute('contenteditable'); x.classList.remove('picked', 'lit'); }
    for (const x of box.querySelectorAll('[style]')) x.removeAttribute('style');
    // empty lines stay lines: an empty paragraph holds a break so other apps keep it
    for (const p of box.querySelectorAll('p')) if (!p.textContent.replace(/[\s​]/g, '') && !p.querySelector('br, sup')) p.innerHTML = '<br>';
    const html = box.innerHTML.replace(/​/g, '');
    // plain text: a line per paragraph or list item, empty lines kept, lists marked
    const lines = [];
    const textOf = (el) => el.textContent.replace(/​/g, '');
    let open = false; // words outside any paragraph (a part of one line) run on the same line
    for (const n of box.childNodes) {
      if (n.nodeName === 'P') { lines.push(textOf(n)); open = false; }
      else if (n.nodeName === 'UL' || n.nodeName === 'OL') {
        let k = 1;
        for (const li of n.querySelectorAll(':scope > li')) lines.push((n.nodeName === 'OL' ? `${k++}. ` : '- ') + textOf(li));
        open = false;
      } else if (n.nodeName === 'LI') { lines.push('- ' + textOf(n)); open = false; }
      else if (open) lines[lines.length - 1] += textOf(n);
      else { lines.push(textOf(n)); open = true; }
    }
    e.preventDefault();
    e.clipboardData.setData('text/html', `<meta charset="utf-8"><div>${html}</div>`);
    e.clipboardData.setData('text/plain', lines.join('\n'));
    if (cut) { if (inside) inside.remove(); else document.execCommand('delete'); layoutNotes(); recount(); saveDoc(); }
  }
  ed.addEventListener('copy', (e) => copyFromPage(e, false));
  ed.addEventListener('cut', (e) => copyFromPage(e, true));

  /* ================= find (⌘F) ================= */
  const findBox = $('find'), findInput = findBox.querySelector('input'), findCount = findBox.querySelector('span');
  const marks = $('marks');
  // every match marked by a small block laid over it; drawn fresh each time so nothing is left behind
  function drawMarks() {
    marks.textContent = '';
    if (!findBox.classList.contains('show')) return;
    const frag = document.createDocumentFragment();
    found.forEach((r, k) => {
      for (const q of r.getClientRects()) {
        const m = document.createElement('i');
        if (k === foundAt) m.className = 'now';
        m.style.cssText = `left:${q.left + scrollX}px;top:${q.top + scrollY}px;width:${q.width}px;height:${q.height}px`;
        frag.append(m);
      }
    });
    marks.append(frag);
  }
  window.addEventListener('resize', drawMarks);
  let found = [], foundAt = -1;
  // exact matches: the whole word (or words), any case, even across bold or italic
  // a pattern for the words typed, in their everyday English forms: plural and possessive, -ed and -ing,
  // -er, -ly, -al and -ally, and back again (origins finds origin). Always whole words, never the inside of
  // another word: "the" doesn't find other or theory. Other languages are matched as typed, whole words
  const ENDINGS = "(?:s|es|'s|’s|s'|s’|ed|d|ing|er|ers|est|ly|al|ally|ion|ions|ation|ations|ic|ical|ically|ness|ment|ments)";
  function stemsOf(w) {
    const out = new Set([w]);
    const cut = (end, add = '') => { if (w.length > end.length + 2 && w.endsWith(end)) out.add(w.slice(0, -end.length) + add); };
    cut("'s"); cut('’s'); cut("s'"); cut('s’');
    cut('ies', 'y'); cut('ied', 'y'); cut('es'); if (!/ss$/.test(w)) cut('s');
    cut('ing'); cut('ing', 'e'); cut('ed'); cut('ed', 'e');
    cut('ally'); cut('ly'); cut('al'); cut('ers'); cut('er'); cut('ations'); cut('ation'); cut('ions'); cut('ion');
    return [...out];
  }
  function wordForms(q) {
    const words = q.split(/\s+/).filter(Boolean);
    if (!words.length) return null;
    const esc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const one = (w) => {
      if (!/^[a-z’']+$/i.test(w)) return esc(w); // not English: as typed
      const alts = stemsOf(w).map((st) => {
        let p = esc(st);
        if (/y$/.test(st)) p = esc(st.slice(0, -1)) + '(?:y|ie|i)';        // study, studies, studied
        else if (/e$/.test(st) && st.length > 3) p = esc(st.slice(0, -1)) + 'e?'; // make, making (not "the", or it would find thing)
        else if (/[bdgklmnprt]$/.test(st)) p += esc(st.slice(-1)) + '?';  // run, running
        return p;
      });
      return `(?:${alts.join('|')})${ENDINGS}{0,2}`; // up to two endings: originals, originally
    };
    try {
      return new RegExp(`(?<![\\p{L}\\p{N}_])${words.map(one).join('[\\s\\u00a0]+')}(?![\\p{L}\\p{N}_])`, 'giu');
    } catch { return null; }
  }
  function search() {
    const q = findInput.value.trim().toLocaleLowerCase();
    found = [];
    if (q) {
      // the page's words as one string, remembering which text each character came from
      let text = '';
      const at = [];
      const walk = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
      let node, block = null;
      while ((node = walk.nextNode())) {
        if (node.parentElement.closest('sup.fn')) continue; // not the footnote numbers
        const b = node.parentElement.closest('p, li, div');
        if (block && b !== block) { text += '\n'; at.push(null); } // lines never run together
        block = b;
        for (let k = 0; k < node.length; k++) at.push([node, k]);
        text += node.data;
      }
      const re = wordForms(q);
      if (re) for (const m of text.matchAll(re)) {
        const a = at[m.index], b = at[m.index + m[0].length - 1];
        if (!a || !b) continue;
        const r = document.createRange();
        r.setStart(a[0], a[1]);
        r.setEnd(b[0], b[1] + 1);
        found.push(r);
      }
    }
    // start from the match nearest where you were
    const here = getSelection().rangeCount && ed.contains(getSelection().anchorNode) ? getSelection().getRangeAt(0) : null;
    foundAt = found.length ? Math.max(0, here ? found.findIndex((r) => r.compareBoundaryPoints(Range.START_TO_START, here) >= 0) : 0) : -1;
    showFound(false);
  }
  function showFound(scroll) {
    findCount.textContent = !findInput.value ? '' : found.length ? `${foundAt + 1} of ${found.length}` : 'None';
    const r = found[foundAt];
    if (r) {
      const box = r.getBoundingClientRect();
      if (scroll || box.top < 60 || box.bottom > innerHeight - 60) scrollBy({ top: box.top - innerHeight / 3 });
    }
    drawMarks();
  }
  function openFind() {
    findBox.classList.add('show');
    const sel = getSelection();
    if (sel.rangeCount && !sel.isCollapsed && ed.contains(sel.anchorNode) && !sel.toString().includes('\n')) findInput.value = sel.toString();
    findInput.focus();
    findInput.select();
    search();
  }
  function closeFind(keepPlace) {
    findBox.classList.remove('show');
    marks.textContent = '';
    const r = found[foundAt];
    ed.focus({ preventScroll: true });
    if (keepPlace && r) placeCaret((x) => { x.setStart(r.startContainer, r.startOffset); x.setEnd(r.endContainer, r.endOffset); });
    found = []; foundAt = -1;
  }
  findInput.addEventListener('input', search);
  findInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && found.length) {
      e.preventDefault();
      foundAt = (foundAt + (e.shiftKey ? found.length - 1 : 1)) % found.length;
      showFound(true);
    } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeFind(true); }
  });
  findInput.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== findInput && findBox.classList.contains('show')) closeFind(false); }, 0));
  ed.addEventListener('input', () => { if (findBox.classList.contains('show')) search(); });

  /* ================= keys ================= */
  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.altKey && e.code === 'KeyF') { e.preventDefault(); addFootnote(); }
    else if (mod && !e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind(); }
    else if (mod && e.key.toLowerCase() === 'g' && findBox.classList.contains('show') && found.length) {
      e.preventDefault();
      foundAt = (foundAt + (e.shiftKey ? found.length - 1 : 1)) % found.length;
      showFound(true);
    }
    else if (mod && e.key === '\\') { e.preventDefault(); toggleBar(); }
    else if (e.key === 'Escape' && root.classList.contains('open')) toggleBar(false);
    else if (mod && e.key.toLowerCase() === 's') {
      e.preventDefault();
      flushAll();
      status('Saved');
    }
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
  window.addEventListener('pagehide', () => {
    leaving = true;
    flushAll();
    if (docName?.startsWith('paper-') && blankPage()) files.remove(docName); // closing a paper you never wrote on
  });

  /* ================= start ================= */
  (async () => {
    // carry over anything written in the first, browser-only version
    try {
      if (local.get('doc') && local.get('file.page') == null) {
        local.set('file.page', JSON.parse(local.get('doc')));
        local.set('file.notes', JSON.parse(local.get('notes') || '""'));
        todos = JSON.parse(local.get('todos') || '[]');
        local.set('file.todo', todoMd());
      }
    } catch {}

    const asked = new URLSearchParams(location.search).get('paper');
    const NAME = /^(page|paper-[a-z0-9]+|file-[a-z0-9]+)$/; // file-…: an .html or .md opened from Finder (the Mac app)
    const start = asked && NAME.test(asked) ? asked : (s.current && NAME.test(s.current) && (native || !s.current.startsWith('file-')) ? s.current : 'page');
    await openDoc(start);
  })();
})();
</script>
</body>
</html>
