<!doctype html>
<html lang="en" data-paper="full" data-font="times">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="assets/PaperHand.css">
<style>
  :root {
    /* a warm, slightly dimmed paper: less glare than white, and ink that isn't pure black */
    --paper: #f3efe6;
    --desk: #ece6db;
    --bar: #ebe6dc;
    --ink: #000;
    --soft: #8d877c;
    --faint: #cbc5b9;
    --size: 20px;
    --lh: 1.4;
    --font: "Times New Roman", Times, serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  [data-font="inter"] { --font: InterVariable, Inter, system-ui, sans-serif; }
  [data-font="helvetica"] { --font: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  [data-font="palatino"] { --font: Palatino, "Palatino Linotype", "Book Antiqua", serif; }

  * { box-sizing: border-box; }
  /* no scroll bars anywhere: the page still scrolls, it just doesn't show a bar */
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(112, 160, 70, .46); } /* green, as mixed */

  /* ---------- paper: the whole screen ---------- */
  [data-paper="full"] #page { min-height: 100vh; padding: 14vh 8vw 50vh; }
  [data-paper="full"] #lines { max-width: 44em; margin-left: auto; margin-right: auto; }

  /* ---------- paper: letter-size leaves, a new one when the last is full ---------- */
  [data-paper="sheet"] body { background: var(--desk); }
  [data-paper="sheet"] #page {
    position: relative;
    width: min(8.5in, 100vw - 32px);
    margin: 8vh auto 40vh;
    padding: 1in;
  }
  #sheets { position: absolute; inset: 0; pointer-events: none; }
  .sheet {
    position: absolute; left: 0; right: 0;
    background: var(--paper);
  }
  /* invisible floats that push the text past each page's bottom margin, the gap, and the next top margin */
  .shim { float: left; clear: left; width: 1px; margin-right: -1px; }
  .shim.band { width: 100%; margin-right: 0; }
  [data-paper="sheet"] #editor { min-height: 0; }
  @media (max-width: 700px) {
    [data-paper="sheet"] #page { padding: 32px 24px; margin-top: 16px; }
    [data-paper="full"] #page { padding: 48px 16px 50vh; }
  }

  /* ---------- the writing ---------- */
  #lines { position: relative; z-index: 1; font-size: var(--size); line-height: var(--lh); }
  #editor {
    position: relative;
    outline: none;
    font-size: var(--size);
    line-height: var(--lh);
    caret-color: transparent; /* drawn by #caret instead, so it can breathe */
    white-space: pre-wrap; /* so a space typed at the end of a line is a real space, never a non-breaking one that starts the next line a little in */
    overflow-x: clip; /* the space where a line wraps hangs just past the edge; its highlight stays inside the column */
    min-height: 50vh;
    overflow-wrap: break-word;
  }
  [data-font="inter"] #editor { letter-spacing: -.005em; }
  [data-font="inter"] #editor b, [data-font="inter"] #editor strong { font-weight: 600; } /* Inter's 700 reads heavier than other fonts' bold */
  #editor p { margin: 0; }
  /* each line finds its own direction: Hebrew and Arabic run right to left, beside English */
  #editor p, #editor li, #notes p, #todos .text, .pg .t { unicode-bidi: plaintext; text-align: start; }
  #editor ul, #editor ol { margin: 0; padding-left: 2.1em; }
  #editor li { padding-left: .3em; transform: translateX(0); } /* the transform does nothing you can see, but makes Safari fill a selection's wrapped lines from where the item's words start, not from the page's left edge */
  #editor ul ul, #editor ol ol, #editor ul ol, #editor ol ul { margin: 0; }
  #editor strike, #editor s { text-decoration-thickness: .07em; }
  #editor a { color: inherit; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  #editor a:hover { text-decoration-color: var(--soft); }

  /* ⌘K: a quiet line to paste a link into */
  #linkbox {
    position: absolute; z-index: 4; display: none;
    width: 300px; max-width: calc(100vw - 32px);
    padding: 6px 10px; border: 1px solid var(--faint); border-radius: 0; outline: none;
    background: var(--paper); color: var(--ink); caret-color: transparent;
    font: 14px/1.4 var(--font);
  }
  #linkbox.show { display: block; }
  #linkbox::placeholder { color: var(--soft); }

  /* ⌘F: find on the page itself (not the side bar); every match softly marked, the current one a little more */
  #find {
    position: fixed; z-index: 4; top: 16px; right: 64px; display: none; align-items: center; gap: 10px;
    padding: 5px 10px; border: 1px solid var(--faint); border-radius: 0;
    background: var(--paper);
  }
  #find.show { display: flex; }
  /* clicking into a link: its address underneath, quietly; click the address to edit it, the arrow to open it */
  #linktip { position: absolute; z-index: 4; display: none; align-items: center; gap: 10px; max-width: 340px; padding: 4px 10px; border: 1px solid var(--faint); background: var(--paper); font: 13px/1.4 var(--font); color: #a8987f; }
  #linktip.show { display: flex; }
  #linktip .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
  #linktip .url:hover { color: var(--ink); }
  #linktip .go { flex: none; cursor: pointer; }
  #linktip .go:hover { color: var(--ink); }
  /* the tiny pages' right-click menu: two words, square, no shadow */
  #pagemenu { position: fixed; z-index: 6; display: none; min-width: 110px; padding: 4px 0; border: 1px solid var(--faint); background: var(--paper); font: 14px/1.4 var(--font); }
  #pagemenu.show { display: block; }
  #pagemenu div { padding: 3px 12px; cursor: default; }
  #pagemenu div:hover { background: rgba(112, 160, 70, .24); }
  #find input { width: 190px; border: 0; outline: none; background: none; color: var(--ink); caret-color: transparent; font: 14px/1.4 var(--font); padding: 0; }
  #find span { font: 13px var(--font); color: #a8987f; white-space: nowrap; }
  /* the matches: soft marks laid over the words (multiplied, so the ink stays black), the current one stronger */
  #marks { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; mix-blend-mode: multiply; }
  #marks i { position: absolute; background: rgba(112, 160, 70, .24); }
  #marks i.now { background: rgba(112, 160, 70, .5); }

  /* footnotes (⌘⌥F): a small raised number in the writing; the note itself lighter and smaller in the
     right margin, level with its line. The number is real text, so a selection runs through it;
     the word count and find leave it out */
  sup.fn { font-size: .62em; line-height: 0; vertical-align: .55em; margin-left: .06em; color: var(--fn); cursor: pointer; } /* selectable, so a selection runs straight through it */
  sup.fn.lit { color: #000; }
  sup.fn.picked { background: rgba(112, 160, 70, .46); }
  sup.fn.picked::selection { background: transparent; }
  #fnotes { position: absolute; left: 0; top: 0; z-index: 1; }
  .fnote { position: absolute; font: 13px/1.35 var(--font); color: var(--fn); transition: color .15s; }
  .fnote .n { margin-right: .7em; user-select: none; -webkit-user-select: none; }
  .fnote .body { outline: none; caret-color: transparent; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* an empty note keeps a real place for the cursor, so Safari doesn't lose it and scroll to the top */
  .fnote .body:empty { display: inline-block; min-width: 2px; min-height: 1.35em; vertical-align: top; }
  .fnote .body:empty::before { content: "Write a note"; color: var(--faint); }
  .fnote.lit { color: #4a4540; }
  :root { --fn: #978972; } /* the light brown, a little darker */

  /* the Mac app: the top of the window is for dragging it, not for writing */
  #titlebar { display: none; position: fixed; z-index: 5; top: 0; left: 0; right: 60px; height: 28px; cursor: default; }
  .native #titlebar { display: block; }

  /* ---------- side bar ---------- */
  #bar {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 320px; max-width: 88vw;
    display: flex; flex-direction: column;
    padding: 39px 24px 20px;
    overflow-y: auto;
    background: var(--paper);
    border-left: 1px solid rgba(40, 30, 10, .07);
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.2, .7, .2, 1);
    font-family: var(--font);
    z-index: 3;
    --adj: 0px; /* Inter and Helvetica run large, so their side bar text is a pixel smaller */
  }
  [data-font="inter"] #bar, [data-font="helvetica"] #bar { --adj: -1px; }
  [data-paper="sheet"] #bar { background: var(--desk); }
  .open #bar { transform: none; }
  /* labels in your own handwriting (Paper Hand), in capitals */
  #bar h2, .ld .k {
    margin: 0; font: 400 24px/1 "Paper Hand", var(--font);
    text-transform: uppercase; letter-spacing: .03em; color: rgba(0, 0, 0, .9);
  }
  #bar h2 { margin-bottom: 12px; }
  #bar section { display: flex; flex-direction: column; min-height: 120px; }
  #notesWrap { flex: 1 1 50%; }
  #todoWrap { flex: 1 1 40%; margin-top: 24px; }
  #notes {
    flex: 1; outline: none; overflow-y: auto; cursor: text; caret-color: transparent; white-space: pre-wrap;
    font: calc(18.5px + var(--adj))/1.35 var(--font);
    color: rgba(0, 0, 0, .9);
    padding-top: .08em; /* the first line starts where it did before the lines were tightened */
  }
  #notes p { margin: 0 0 .35em; }

  /* to-dos: your hand-drawn box, and a quick tick when done */
  #todos { list-style: none; margin: 0; padding: 0; overflow-y: auto; outline: none; caret-color: transparent; }
  #todos li { position: relative; display: flex; align-items: flex-start; gap: .55em; font-size: calc(18px + var(--adj)); line-height: 1.26; margin-bottom: .35em; cursor: text; }
  #todos .text { flex: 1; min-width: 0; outline: none; caret-color: transparent; font: inherit; color: rgba(0, 0, 0, .9); white-space: pre-wrap; overflow-wrap: anywhere; }
  /* done: a thin straight black line through the middle of the words (see strikeThrough) */
  #todos .strike { user-select: none; -webkit-user-select: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  #todos .strike path { fill: none; stroke: #000; stroke-width: 1; }
  /* sized and placed by fitBoxes(): its top meets the top of the capitals, its bottom just below the line */
  .check { flex: none; position: relative; padding: 0; border: 0; background: none; cursor: pointer; }
  .check img { position: absolute; left: 0; top: 0; display: block; height: 100%; width: auto; opacity: .6; }
  /* the tick is one of five from your own hand, on a canvas with room above and to the right of
     the box (22px of 147 tall, 22 of 158 wide), turning and growing about its own point */
  /* the tick: one of your four, revealed along the pen's path when you tick it (280 ms) */
  .check svg { position: absolute; left: 0; top: -14.966%; height: 114.966%; width: auto; overflow: visible; opacity: .9; display: none; transform-origin: 31.67% 77.51%; }
  .done .check svg { display: block; }
  .check svg path { fill: none; stroke: #fff; stroke-width: 34; stroke-linecap: round; stroke-linejoin: round; }
  .check svg path.go { stroke-dasharray: 1 1; animation: draw 280ms cubic-bezier(.45, 0, .65, 1) both; }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  .done .check .b0 { opacity: .9; }

  /* settings: your handwritten label, a fine line, then the value */
  #bar footer { display: flex; flex-direction: column; margin-top: 24px; }
  .ld { display: flex; align-items: baseline; gap: 9px; padding: 3px 0; } /* room either side of the line, so the size arrows never touch it */
  .ld .line { flex: 1; height: 3px; transform: translateY(-4px); background: linear-gradient(#c4bdb0, #c4bdb0) left center / 100% 1px no-repeat; }
  .ld .v { font: calc(18px + var(--adj))/1.4 var(--font); color: rgba(0, 0, 0, .9); text-align: right; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .ld .num { position: relative; display: inline-block; cursor: ew-resize; touch-action: none; }
  .ld .num u { position: absolute; top: 50%; margin-top: -7.8px; display: block; line-height: 0; text-decoration: none; color: transparent; transition: color .2s; cursor: pointer; padding: 4px 2px; } /* fading the colour, not the opacity, so hovering never nudges the arrows sideways */
  .ld .num u svg { display: block; width: 4.2px; height: 7.6px; fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  .ld .num u:first-child { right: 100%; margin-right: 2.8px; } /* the arrow's point just touches the line */
  .ld .num u:last-child { left: 100%; margin-left: 2.8px; }
  .ld:hover .num u { color: var(--soft); }

  /* the word count, and export (or, on the website, the app download) */
  .tail { display: flex; justify-content: space-between; align-items: center; gap: 28px; margin-top: 28px; }
  #count { font: italic calc(16.6px + var(--adj))/1 var(--font); color: #000; user-select: none; white-space: nowrap; }
  .tools { display: flex; align-items: center; gap: 16px; }
  #export { display: flex; align-items: center; gap: 12px; }
  #papersBtn { display: block; height: 16px; width: auto; cursor: pointer; }
  .papers-view #papersBtn { height: 11px; } /* the back arrow */
  #papersBtn:hover, #papersBtn:active { opacity: .6; }

  /* papers: the side bar becomes a little desk of tiny pages; click one to open it */
  /* two side bars that never overlap: notes and to-dos, or papers; the corner icon switches */
  #bar #papersWrap { display: none; flex: 1 1 auto; min-height: 0; }
  .papers-view #bar #papersWrap { display: flex; }
  .papers-view #notesWrap, .papers-view #todoWrap, .papers-view #options .ld { display: none; }
  .papers-view #count, .papers-view #export { visibility: hidden; }
  .papers-view .tail { margin-top: 0; } /* the settings above it are hidden, so the arrow sits closer to the pages: about half the room */
  .pgrid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: max-content; align-content: start; gap: 18px 18px; padding: 2px 1px 8px; } /* rows as tall as the pages, so the gap below each page stays */
  .pg { aspect-ratio: 8.5 / 11; min-width: 0; border: 1px solid #c4bdb0; background: var(--paper); padding: 10px 10px; cursor: pointer; overflow: hidden; }
  .pg:hover { border-color: var(--soft); }
  .pg.on { border-color: rgba(0, 0, 0, .8); }
  /* hovering a tiny page shows a light X in its top corner: click it to take the paper off the tiny pages (kept in ~/Paper/removed) */
  .pg { position: relative; }
  .pg .del { position: absolute; right: 3px; top: 3px; height: 8px; width: auto; padding: 4px; box-sizing: content-box; background: var(--paper); opacity: 0; transition: opacity .2s; cursor: pointer; }
  .pg:hover .del { opacity: 1; } /* a dark green, from the highlight */
  .pg .del:hover { filter: brightness(.6); }
  .pg .t {
    display: block; white-space: pre-line; /* each paragraph on its own line; fitted to the page by fitPreview() */
    font: 400 15px/1.2 "Paper Hand", var(--font); color: rgba(0, 0, 0, .9); overflow-wrap: anywhere;
  }
  .pg .t.blank { opacity: .4; }
  .pg.new { display: flex; align-items: center; justify-content: center; border-style: dashed; }
  .pg.new img { height: 14px; width: auto; }
  #export .sym { display: block; height: 14px; width: auto; cursor: pointer; }
  #export .choice { font: calc(15px + var(--adj))/1 var(--font); color: #000; cursor: pointer; white-space: nowrap; }
  #export .dl { font: 400 18.6px/1 "Paper Hand", var(--font); text-transform: uppercase; letter-spacing: .03em; color: #000; text-decoration: none; }
  #export .sym:hover, #export .sym:active, #export .choice:hover, #export .dl:hover { opacity: .6; }

  /* a handwritten S at the middle of the right edge, shown when you come near it, opens the side bar */
  #edge { position: fixed; top: 0; right: 0; bottom: 0; width: 44px; cursor: pointer; z-index: 2; }
  #edge::after {
    content: "S"; position: absolute; right: 18.8px; top: 50%; transform: translateY(-50%);
    font: 400 19px/1 "Paper Hand", var(--font); color: #000; opacity: 0; transition: opacity .3s;
  }
  #edge:hover::after { opacity: .55; }
  .open #edge { display: none; }

  #caret {
    position: absolute; z-index: 4; width: 1px;
    background: rgb(60, 45, 20); pointer-events: none;
    animation: breathe 2.4s cubic-bezier(.45, 0, .55, 1) infinite alternate;
  }
  #caret[hidden] { display: none; }
  @keyframes breathe { from { opacity: .45; } to { opacity: 0; } }

  #status {
    position: fixed; left: 20px; bottom: 16px;
    font: 13px var(--font); color: #a8987f; /* a light brown, like the paper's own lines */
    opacity: 0; transition: opacity 1.2s; pointer-events: none;
  }
  #status.show { opacity: 1; transition: opacity .6s; }

  @media print {
    #bar, #edge, #status { display: none; }
    body { background: none !important; }
    #page { box-shadow: none !important; margin: 0 !important; padding: 0 !important; width: auto !important; min-height: 0 !important; }
  }
</style>
</head>
<body>

  <div id="page">
    <div id="sheets"></div>
    <div id="lines"><div id="shims" aria-hidden="true"></div><div id="editor" contenteditable="true" spellcheck="true" autocorrect="off" writingsuggestions="false"></div></div>
  </div>

  <div id="edge"></div>
  <aside id="bar">
    <section id="notesWrap">
      <h2>Notes</h2>
      <div id="notes" contenteditable="true" spellcheck="true" autocorrect="off" writingsuggestions="false"></div>
    </section>
    <section id="todoWrap">
      <h2>To do</h2>
      <ul id="todos"></ul>
    </section>
    <section id="papersWrap">
      <h2>Papers</h2>
      <div class="pgrid" id="pgrid"></div>
    </section>
    <footer id="options"></footer>
  </aside>
  <div id="status"></div>
  <div id="caret" hidden></div>
  <input id="linkbox" type="text" placeholder="Paste a link, then enter" spellcheck="false" autocomplete="off">
  <div id="marks" aria-hidden="true"></div>
  <div id="fnotes"></div>
  <div id="titlebar" aria-hidden="true"></div>
  <div id="linktip"><span class="url" title="Edit the link"></span><span class="go" title="Open the link">↗</span></div>
  <div id="find"><input type="text" spellcheck="false" autocomplete="off" autocorrect="off" writingsuggestions="false"><span></span></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const ed = $('editor'), notes = $('notes'), list = $('todos');

  /* ================= storage =================
     In Paper.app: the app saves files to ~/Paper.
     Served by server.js on this Mac: the server saves files to ~/Paper.
     On the website, or opened as a plain file: this browser's own storage. */
  const native = window.webkit?.messageHandlers?.paper;
  if (native) document.documentElement.classList.add('native');
  const onServer = !native && ['localhost', '127.0.0.1'].includes(location.hostname);
  const onWeb = !native && !onServer;
  const ask = (msg) => native.postMessage(msg).catch(() => null);
  const local = {
    get: (k) => { try { return localStorage.getItem('paper.' + k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem('paper.' + k, v); } catch {} },
  };
  let leaving = false;

  const files = {
    async get(name) {
      if (native) return (await ask({ op: 'get', name })) ?? '';
      if (onServer) {
        try { const r = await fetch('/api/files/' + name); if (r.ok) return await r.text(); } catch {}
      }
      return local.get('file.' + name) ?? '';
    },
    put(name, text) {
      local.set('file.' + name, text);
      local.set('mtime.' + name, String(Date.now()));
      if (native) return void ask({ op: 'put', name, text });
      if (!onServer) return;
      fetch('/api/files/' + name, {
        method: 'PUT',
        headers: { 'x-paper': '1', 'content-type': 'text/plain;charset=utf-8' },
        body: text,
        keepalive: leaving && text.length < 60000,
      }).catch(() => {});
    },
    // only for a paper with nothing on it; Paper's own first page and files opened from Finder are never removed
    remove(name) {
      if (!/^paper-[a-z0-9]+$/.test(name)) return;
      try { for (const k of [name, 'notes-' + name, 'todo-' + name]) { localStorage.removeItem('paper.file.' + k); localStorage.removeItem('paper.mtime.' + k); } } catch {}
      if (native) return void ask({ op: 'delete', name });
      if (onServer) fetch('/api/files/' + name, { method: 'DELETE', headers: { 'x-paper': '1' } }).catch(() => {});
    },
    // the X on a tiny page: off the list, kept in ~/Paper/removed (in the browser, kept aside under its own key)
    async putAway(name) {
      if (!/^(paper-|file-)[a-z0-9]+$/.test(name)) return;
      try {
        for (const k of [name, 'notes-' + name, 'todo-' + name]) {
          const v = localStorage.getItem('paper.file.' + k);
          if (v !== null && !native && !onServer) localStorage.setItem('paper.removed.' + k, v);
          localStorage.removeItem('paper.file.' + k); localStorage.removeItem('paper.mtime.' + k);
        }
      } catch {}
      if (native) return ask({ op: 'away', name });
      if (onServer) { try { await fetch('/api/files/' + name + '?away=1', { method: 'DELETE', headers: { 'x-paper': '1' } }); } catch {} }
    },
    async trash(name) {
      if (!/^(paper-|file-)[a-z0-9]+$/.test(name)) return;
      try { for (const k of [name, 'notes-' + name, 'todo-' + name]) { localStorage.removeItem('paper.file.' + k); localStorage.removeItem('paper.mtime.' + k); } } catch {}
      if (native) return ask({ op: 'trash', name });
      if (onServer) { try { await fetch('/api/files/' + name + '?trash=1', { method: 'DELETE', headers: { 'x-paper': '1' } }); } catch {} }
    },
    async list() {
      if (native) return (await ask({ op: 'list' })) || [];
      if (onServer) {
        try { const r = await fetch('/api/papers'); if (r.ok) return await r.json(); } catch {}
      }
      const out = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const m = localStorage.key(i).match(/^paper\.file\.(page|paper-[a-z0-9]+)$/);
          if (!m) continue;
          const doc = new DOMParser().parseFromString(localStorage.getItem(localStorage.key(i)), 'text/html');
          out.push({ name: m[1], first: previewOf(doc), modified: +(local.get('mtime.' + m[1]) || 0) });
        }
      } catch {}
      return out;
    },
    markdown(name, text) {
      if (native) return void ask({ op: 'markdown', name, text });
      if (!onServer) return;
      fetch('/api/markdown/' + name, {
        method: 'PUT',
        headers: { 'x-paper': '1', 'content-type': 'text/plain;charset=utf-8' },
        body: text,
        keepalive: leaving && text.length < 60000,
      }).catch(() => {});
    },
  };

  // a debounced save that can also be flushed right away
  const savers = [];
  function saver(fn, ms) {
    let t = null;
    const run = () => { clearTimeout(t); t = null; fn(); };
    const soon = () => { clearTimeout(t); t = setTimeout(run, ms); };
    soon.flush = () => { if (t) run(); };
    savers.push(soon);
    return soon;
  }
  const flushAll = () => savers.forEach((s) => s.flush());

  let statusTimer;
  function status(msg) {
    const el = $('status');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  /* ================= settings ================= */
  const DEFAULTS = { font: 'times', size: 15, spacing: 1.4, paper: 'full', unit: 'pt' };
  const s = Object.assign({}, DEFAULTS, window.PAPER_SETTINGS || JSON.parse(local.get('settings') || '{}'));
  // sizes used to be pixels; they're points now, as in Pages and Word, so carry an old setting across
  if (s.unit !== 'pt') { s.size = Math.round((+s.size || 20) * .75); s.unit = 'pt'; }
  // each paper keeps its own size
  if (!s.sizes) s.sizes = { full: 16, sheet: 14 };
  s.size = s.sizes[s.paper] ?? DEFAULTS.size;

  const CHOICES = {
    font: [['times', 'Times'], ['inter', 'Inter'], ['helvetica', 'Helvetica'], ['palatino', 'Palatino']],
    paper: [['full', 'Open'], ['sheet', 'Leaf']],
  };
  const RANGE = { size: [10, 30, 1], spacing: [1, 2, .1] }; // size in points, as in Pages and Word
  const SHOW = { size: (v) => String(v), spacing: (v) => v.toFixed(1) };
  const snap = (k, v) => { const [a, b, st] = RANGE[k]; return +Math.min(b, Math.max(a, Math.round(v / st) * st)).toFixed(2); };
  // settings saved before these choices existed land on the nearest one
  if (!CHOICES.font.some(([v]) => v === s.font)) s.font = DEFAULTS.font;
  if (!CHOICES.paper.some(([v]) => v === s.paper)) s.paper = DEFAULTS.paper;
  for (const k of Object.keys(RANGE)) s[k] = snap(k, +s[k] || DEFAULTS[k]);

  const EXPORTS = [['md', 'md'], ['docx', 'word']];
  const ROWS = [['font', 'Font'], ['size', 'Size'], ['spacing', 'Spacing'], ['paper', 'Paper']];

  // each setting: your handwritten label, a fine line, the value.
  // click a word to change it; numbers have ‹ › on hover, or drag them left and right
  function buildOptions() {
    const box = $('options');
    for (const [key, label] of ROWS) {
      const row = document.createElement('div');
      row.className = 'ld';
      row.innerHTML = `<span class="k">${label}</span><span class="line"></span>`;
      const v = document.createElement('span');
      v.className = 'v';
      v.dataset.key = key;
      if (CHOICES[key]) {
        v.onclick = () => {
          const c = CHOICES[key], i = c.findIndex(([x]) => x === s[key]);
          set(key, c[(i + 1) % c.length][0]);
        };
      } else {
        v.classList.add('num');
        v.innerHTML = '<u data-d="-1"><svg viewBox="0 0 5 9"><path d="M4.4 .6 L.6 4.5 L4.4 8.4"/></svg></u><span class="n"></span><u data-d="1"><svg viewBox="0 0 5 9"><path d="M.6 .6 L4.4 4.5 L.6 8.4"/></svg></u>';
        v.querySelectorAll('u').forEach((u) => {
          const step = () => set(key, snap(key, s[key] + +u.dataset.d * RANGE[key][2]));
          let wait, repeat;
          const stop = () => { clearTimeout(wait); clearInterval(repeat); };
          u.onpointerdown = (e) => {
            e.preventDefault(); e.stopPropagation();
            step();
            wait = setTimeout(() => { repeat = setInterval(step, 90); }, 350); // hold to keep going
          };
          u.onpointerup = u.onpointerleave = u.onpointercancel = stop;
          u.onclick = (e) => e.stopPropagation();
        });
        const n = v.querySelector('.n');
        let x0, v0;
        n.onpointerdown = (e) => { n.setPointerCapture(e.pointerId); x0 = e.clientX; v0 = s[key]; };
        n.onpointermove = (e) => { if (n.hasPointerCapture(e.pointerId)) set(key, snap(key, v0 + Math.round((e.clientX - x0) / 7) * RANGE[key][2])); };
      }
      row.append(v);
      box.append(row);
    }
    const tail = document.createElement('div');
    tail.className = 'tail';
    tail.innerHTML = '<span id="count"></span><span class="tools"><span id="export"></span><img id="papersBtn" src="assets/icon-pages.png" alt="papers" title="papers"></span>';
    box.append(tail);
    if (onWeb) $('export').innerHTML = '<a class="dl" href="Paper.zip" download>download</a>';
    else showExport(false);
    $('papersBtn').onclick = (e) => { e.stopPropagation(); showPapers(!root.classList.contains('papers-view')); };
  }

  // each arrow's point at exactly the height of its row's line
  function alignArrows() {
    document.querySelectorAll('#options .ld').forEach((row) => {
      const num = row.querySelector('.num');
      if (!num) return;
      const line = row.querySelector('.line').getBoundingClientRect();
      const top = line.top + line.height / 2 - num.getBoundingClientRect().top;
      num.querySelectorAll('u').forEach((u) => { u.style.top = top + 'px'; });
    });
  }

  function paintOptions() {
    document.querySelectorAll('#options .v').forEach((v) => {
      const k = v.dataset.key;
      if (CHOICES[k]) v.textContent = CHOICES[k].find(([x]) => x === s[k])[1];
      else {
        v.querySelector('.n').textContent = SHOW[k](s[k]);
        v.querySelector('u[data-d="-1"]').style.visibility = s[k] <= RANGE[k][0] ? 'hidden' : '';
        v.querySelector('u[data-d="1"]').style.visibility = s[k] >= RANGE[k][1] ? 'hidden' : '';
      }
    });
  }

  // export: your envelope; click it for md or word
  let exportOpen = false;
  function showExport(open) {
    exportOpen = open;
    const v = $('export');
    v.innerHTML = '';
    if (open) {
      for (const [kind, text] of EXPORTS) {
        const el = document.createElement('span');
        el.className = 'choice';
        el.textContent = text;
        el.onclick = (e) => { e.stopPropagation(); showExport(false); exportAs(kind); };
        v.append(el);
      }
    }
    const sym = document.createElement('img');
    sym.className = 'sym';
    sym.src = 'assets/icon-export.png'; // your envelope
    sym.alt = sym.title = 'export';
    sym.onclick = (e) => { e.stopPropagation(); showExport(!exportOpen); };
    v.append(sym);
  }
  document.addEventListener('click', () => { if (exportOpen) showExport(false); });

  // to-do boxes: the top meets the top of the capitals and the bottom sits just below the line,
  // measured from whatever font is in use
  const BOX_IN_IMAGE = {"top": 0.1429, "height": 0.8299, "left": 0.0127, "width": 0.7785}; // where the drawn box sits inside its image
  function fitBoxes() {
    const li = $('todos').querySelector('li');
    if (!li) return;
    const cs = getComputedStyle(li);
    const fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight) || fs * 1.26;
    const c = document.createElement('canvas').getContext('2d');
    c.font = `${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
    const m = c.measureText('H');
    // where the words really sit: measured from a to-do with words in it, so every font lines up the same way
    let baseline = (lh - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
    for (const text of $('todos').querySelectorAll('.text')) {
      const words = [...text.childNodes].find((n) => n.nodeType === 3 && n.data.trim());
      if (!words) continue;
      const r = document.createRange();
      r.selectNodeContents(words);
      const line = r.getClientRects()[0];
      if (line && line.height) baseline = line.bottom - m.fontBoundingBoxDescent - text.closest('li').getBoundingClientRect().top;
      break;
    }
    const capTop = baseline - m.actualBoundingBoxAscent;
    const imgH = (m.actualBoundingBoxAscent + fs * .14) / BOX_IN_IMAGE.height;
    const img = $('todos').querySelector('.check img');
    const imgW = img && img.naturalHeight ? imgH * img.naturalWidth / img.naturalHeight : imgH;
    // the box a touch taller than the capitals, with the words centred in it
    const boxTop = capTop - fs * .07;
    $('todos').querySelectorAll('.check').forEach((b) => {
      b.style.height = imgH + 'px';
      b.style.width = (BOX_IN_IMAGE.left + BOX_IN_IMAGE.width) * imgW + 'px';
      b.style.marginTop = boxTop - BOX_IN_IMAGE.top * imgH + 'px';
    });
    strikeAll(); // the lines through done to-dos follow the font and size too
  }

  /* ---------- leaf: lay the text out across letter-size pages ---------- */
  const GAP = 24; // desk showing between pages
  let pages = 0, geometry = '';

  function layoutPages(n, pageH, content, band) {
    const shims = $('shims'), sheets = $('sheets');
    shims.innerHTML = '';
    sheets.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      sheet.style.top = i * (pageH + GAP) + 'px';
      sheet.style.height = pageH + 'px';
      sheets.append(sheet);
      if (i === n - 1) break;
      const room = document.createElement('div');
      room.className = 'shim';
      room.style.height = content + 'px';
      const gap = document.createElement('div');
      gap.className = 'shim band';
      gap.style.height = band + 'px';
      shims.append(room, gap);
    }
    $('page').style.minHeight = n * pageH + (n - 1) * GAP + 'px';
  }

  function paginate() {
    paginateSheets();
    layoutNotes();
  }
  function paginateSheets() {
    if (s.paper !== 'sheet') {
      if (pages) { $('shims').innerHTML = ''; $('sheets').innerHTML = ''; $('page').style.minHeight = ''; pages = 0; geometry = ''; }
      return;
    }
    const page = $('page');
    const cs = getComputedStyle(page);
    const pageH = page.offsetWidth * 11 / 8.5; // letter proportions at whatever width the leaf has
    const top = parseFloat(cs.paddingTop), bottom = parseFloat(cs.paddingBottom);
    const content = pageH - top - bottom;
    const band = bottom + GAP + top;
    const key = [pageH, top, bottom, s.font, s.size, s.spacing].join();
    if (key !== geometry) { geometry = key; pages = 0; }
    let n = pages || 1;
    for (let i = 0; i < 6; i++) {
      if (n !== pages) { layoutPages(n, pageH, content, band); pages = n; }
      const need = Math.max(1, Math.ceil((ed.offsetHeight + band) / (content + band) - 1e-6));
      if (need === n) break;
      n = need;
    }
  }
  window.addEventListener('resize', paginate);
  document.fonts?.ready.then(() => { paginate(); fitBoxes(); });

  // a font's "single" line spacing, as Docs and Word use it: the height the font itself asks for
  const singles = new Map();
  function singleSpacing() {
    const family = getComputedStyle(ed).fontFamily;
    if (!singles.has(family)) {
      const probe = document.createElement('span');
      probe.style.cssText = `position:absolute;visibility:hidden;font-family:${family};font-size:100px;line-height:normal;white-space:nowrap`;
      probe.textContent = 'Hg';
      document.body.append(probe);
      singles.set(family, probe.getBoundingClientRect().height / 100);
      probe.remove();
    }
    return singles.get(family);
  }
  document.fonts?.ready.then(() => { singles.clear(); applySettings(); });

  function applySettings() {
    for (const k of ['font', 'paper']) root.dataset[k] = s[k];
    root.style.setProperty('--size', s.size * 4 / 3 + 'px'); // points to pixels
    // line height on whole pixels, so a big selection is one solid block with no hairline gaps between lines
    root.style.setProperty('--lh', Math.round(s.size * 4 / 3 * s.spacing) + 'px');
    paintOptions();
    requestAnimationFrame(() => { fitBoxes(); alignArrows(); });
  }

  function set(key, value) {
    s[key] = value;
    if (key === 'size') s.sizes[s.paper] = value;
    if (key === 'paper') s.size = s.sizes[value] ?? DEFAULTS.size;
    local.set('settings', JSON.stringify(s));
    if (native) ask({ op: 'settings', text: JSON.stringify(s) });
    applySettings();
    paginate();
  }

  buildOptions();
  applySettings();
  $('bar').addEventListener('transitionend', alignArrows);

  /* ================= the page ================= */
  document.execCommand('defaultParagraphSeparator', false, 'p');
  let docName = null;

  const saveDoc = saver(() => {
    if (docName) { files.put(docName, ed.innerHTML.replace(/class="fn[^"]*"/g, 'class="fn"')); files.markdown(docName, toMarkdown(ed)); }
    retitle();
  }, 400);

  /* ---------- markdown ---------- */
  // markdown to the page: paragraphs, lists (nested by indent), links, bold, italic, underline
  // and strikethrough; headings and quotes become plain paragraphs, headings in bold
  // one paragraph of markdown, as formatting (no surrounding <p>)
  function fromMarkdownInline(md) {
    const html = fromMarkdown(md.replace(/\n+/g, ' '));
    return html.replace(/^<p>([\s\S]*)<\/p>$/, '$1');
  }
  // plain text that's really markdown: bold, italic, links, headings, lists or footnotes in markdown's marks
  const looksLikeMarkdown = (t) => /(\*\*|__)\S[\s\S]*?\S?\1|(^|[\s(])[*_]\S[^*_\n]*?\S?[*_](?=[\s.,;:!?)]|$)|\[[^\]]+\]\([^)\s]+\)|\[\^[^\]]+\]|^#{1,6}\s|^\s*[-*+]\s+\S|^\s*\d+\.\s+\S|~~\S/m.test(t);
  function fromMarkdown(md) {
    const escHtml = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    function inline(t) {
      const held = [];
      const hold = (html) => `\u0000${held.push(html) - 1}\u0000`;
      t = t.replace(/\\([\\`*_[\]#>~-])/g, (_, c) => hold(escHtml(c)));               // escaped marks stay as they are
      t = t.replace(/`([^`]+)`/g, (_, c) => hold(escHtml(c)));                          // code: just its words
      t = t.replace(/\[\^([^\]]+)\]/g, (_, id) => hold(`<sup class="fn" contenteditable="false" data-note="${(defs[id] != null ? inline(defs[id]) : '').replace(/&/g, '&amp;').replace(/"/g, '&quot;')}"></sup>`));
      t = t.replace(/<u>([\s\S]*?)<\/u>/g, (_, c) => hold('<u>' + inline(c) + '</u>'));
      t = t.replace(/\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (_, txt, href) =>
        hold(`<a href="${escHtml(href).replace(/"/g, '&quot;')}">${inline(txt)}</a>`));
      t = escHtml(t);
      t = t.replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, '<b>$2</b>');
      t = t.replace(/(\*|_)(?=\S)([\s\S]*?\S)\1/g, '<i>$2</i>');
      t = t.replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<s>$1</s>');
      return t.replace(/\u0000(\d+)\u0000/g, (_, k) => held[+k]);
    }
    const out = [];
    const defs = {};
    md = md.replace(/\r\n?/g, '\n').replace(/^\[\^([^\]]+)\]:\s*(.*)$/gm, (_, id, t) => { defs[id] = t; return ''; });
    const lines = md.split('\n');
    let para = [], blanks = 0;
    const flush = () => { if (para.length) out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; };
    for (let k = 0; k < lines.length; k++) {
      const line = lines[k];
      if (line.trim()) {
        // more than one blank line before this: the extra ones are empty lines on the page
        if (out.length && blanks > 1 && !para.length) for (let e = 1; e < blanks; e++) out.push('<p><br></p>');
        blanks = 0;
      } else blanks++;
      const item = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if (item) {
        flush();
        // a run of list lines, nested by how far each is indented
        const stack = [];
        for (; k < lines.length; k++) {
          const m = lines[k].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
          if (!m) { k--; break; }
          const depth = m[1].replace(/\t/g, '    ').length, tag = /\d/.test(m[2]) ? 'ol' : 'ul';
          while (stack.length && depth < stack[stack.length - 1].depth) out.push(`</li></${stack.pop().tag}>`);
          const top = stack[stack.length - 1];
          if (!top || depth > top.depth) { out.push(`<${tag}><li>`); stack.push({ depth, tag }); }
          else if (top.tag !== tag) { out.push(`</li></${stack.pop().tag}><${tag}><li>`); stack.push({ depth, tag }); } // bullets, then numbers
          else out.push('</li><li>');
          out.push(inline(m[3]));
        }
        while (stack.length) out.push(`</li></${stack.pop().tag}>`);
        continue;
      }
      if (!line.trim()) { flush(); continue; }
      const head = line.match(/^#{1,6}\s+(.*?)\s*#*$/);
      if (head) { flush(); out.push('<p><b>' + inline(head[1]) + '</b></p>'); continue; }
      para.push(line.replace(/^>\s?/, '').replace(/\s{2,}$/, ''));
    }
    flush();
    return out.join('');
  }

  function toMarkdown(rootEl) {
    const esc = (t) => t.replace(/\u00a0/g, ' ').replace(/\u200b/g, '').replace(/([\\`*_\[\]])/g, '\\$1');
    // markers have to hug the words: "** bold **" isn't bold in markdown
    const wrap = (open, text, close = open) => {
      const m = text.match(/^(\s*)([\s\S]*?)(\s*)$/);
      return m[2] ? m[1] + open + m[2] + close + m[3] : text;
    };
    const notesOut = [];
    function inline(node) {
      let out = '';
      for (const n of node.childNodes) {
        if (n.nodeType === 3) { out += esc(n.data); continue; }
        if (n.nodeType !== 1) continue;
        if (n.nodeName === 'SUP' && n.classList.contains('fn')) {
          const box = document.createElement('div');
          box.innerHTML = noteHtml(n.dataset.note || '');
          notesOut.push(inline(box).replace(/\n+/g, ' '));
          out += `[^${notesOut.length}]`;
          continue;
        }
        switch (n.nodeName) {
          case 'B': case 'STRONG': out += wrap('**', inline(n)); break;
          case 'I': case 'EM': out += wrap('*', inline(n)); break;
          case 'S': case 'STRIKE': case 'DEL': out += wrap('~~', inline(n)); break;
          case 'U': out += wrap('<u>', inline(n), '</u>'); break;
          case 'A': out += `[${inline(n)}](${n.getAttribute('href')})`; break;
          case 'BR': out += '\n'; break;
          case 'UL': case 'OL': break; // handled as nested lists
          default: out += inline(n);
        }
      }
      return out;
    }
    function list(el, indent, lines) {
      let i = 1;
      for (const c of el.children) {
        if (c.nodeName === 'LI') {
          const marker = el.nodeName === 'OL' ? `${i++}. ` : '- ';
          lines.push(indent + marker + inline(c).trim().replace(/\n+/g, ' '));
          for (const sub of c.children) if (sub.nodeName === 'UL' || sub.nodeName === 'OL') list(sub, indent + ' '.repeat(marker.length), lines);
        } else if (c.nodeName === 'UL' || c.nodeName === 'OL') {
          list(c, indent + '  ', lines);
        }
      }
      return lines;
    }
    // an empty line between paragraphs is written as one more blank line, so it comes back when read
    const blocks = [];
    let spare = 0;
    const push = (t) => { blocks.push('\n'.repeat(spare) + t); spare = 0; };
    for (const b of rootEl.children) {
      if (b.nodeName === 'UL' || b.nodeName === 'OL') { push(list(b, '', []).join('\n')); continue; }
      const text = inline(b).trim().replace(/\n/g, '  \n');
      if (text) push(text.replace(/^(#|>|[-+] )/, '\\$1').replace(/^(\d+)\. /, '$1\\. '));
      else if (blocks.length) spare++;
    }
    if (notesOut.length) blocks.push(notesOut.map((t, k) => `[^${k + 1}]: ${t}`).join('\n'));
    return blocks.join('\n\n') + '\n';
  }

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  async function exportAs(kind) {
    saveDoc.flush();
    const name = (document.title || 'Paper').replace(/[\\/:*?"<>|]/g, '').slice(0, 60);
    // in the app: a normal Save dialog, and the app makes the file
    if (native) return void ask({ op: 'export', kind, name, font: s.font, text: kind === 'md' ? toMarkdown(ed) : ed.innerHTML });
    if (kind === 'md') return download(new Blob([toMarkdown(ed)], { type: 'text/markdown;charset=utf-8' }), name + '.md');
    // word: the server turns the page into a .docx with the Mac's own converter
    if (!onServer) return;
    try {
      const r = await fetch('/api/export/docx?font=' + s.font, {
        method: 'POST',
        headers: { 'x-paper': '1', 'content-type': 'text/plain;charset=utf-8' },
        body: ed.innerHTML,
      });
      if (!r.ok) throw new Error(await r.text());
      download(await r.blob(), name + '.docx');
    } catch {}
  }

  // words as each language has them: Chinese and Japanese don't put spaces between words
  const words = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'word' }) : null;
  function recount() {
    const text = ed.innerText;
    const all = words ? [...words.segment(text)].filter((w) => w.isWordLike).length : (text.match(/\S+/g) || []).length;
    const n = Math.max(0, all - ed.querySelectorAll('sup.fn').length); // footnote numbers aren't words
    $('count').textContent = n === 1 ? '1 word' : n + ' words';
  }

  function retitle() {
    const first = Array.from(wordsOf(ed.querySelector('p, li') || ed).trim()).slice(0, 48).join(''); // whole characters, never half an emoji
    document.title = first || 'Paper';
    if (native) ask({ op: 'title', text: document.title });
  }

  /* ---------- papers ---------- */
  const newName = () => 'paper-' + Date.now().toString(36);
  async function newPaper() {
    const name = newName();
    files.put(name, '<p><br></p>');
    await openDoc(name);
  }
  // a block's words, without footnote numbers
  const wordsOf = (b) => { const c = b.cloneNode(true); c.querySelectorAll('sup.fn').forEach((x) => x.remove()); return c.textContent.replace(/\u200b/g, ''); };
  // a paper's writing from the top, a line per paragraph, its blank lines kept (but none trailing at the end)
  const previewOf = (root) => [...root.querySelectorAll('p, li')].map((b) => wordsOf(b).replace(/\s+/g, ' ').trim()).join('\n').replace(/\s+$/, '').slice(0, 600);

  // as much as fits on the tiny page, with room for the tails of g and y on the last line,
  // cut at a word with … where it stops
  function fitPreview(el) {
    const full = el.textContent;
    const page = el.parentElement, cs = getComputedStyle(page);
    const room = page.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - parseFloat(getComputedStyle(el).fontSize) * .45;
    if (el.offsetHeight <= room || room < 20) return; // not laid out yet (or no room at all): leave the words alone
    const chars = Array.from(full);
    const cut = (n) => chars.slice(0, n).join('').replace(/\s+\S*$/, '').replace(/[\s,.;:]+$/, '') + '…';
    let lo = 0, hi = chars.length;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      el.textContent = cut(mid);
      if (el.offsetHeight <= room) lo = mid; else hi = mid - 1;
    }
    el.textContent = cut(lo);
  }

  // the corner icon: pages on the normal side bar, a back arrow on the papers one
  function setPapersView(open) {
    root.classList.toggle('papers-view', open);
    const b = $('papersBtn');
    if (b) {
      b.src = open ? 'assets/icon-back.png' : 'assets/icon-pages.png';
      b.alt = b.title = open ? 'back' : 'papers';
    }
  }
  async function showPapers(open) {
    setPapersView(open);
    if (!open) return;
    saveDoc.flush();
    const grid = $('pgrid');
    const papers = await files.list();
    // the open paper's first line is whatever is on the page right now
    const here = papers.find((p) => p.name === docName);
    if (here) here.first = previewOf(ed);
    else papers.push({ name: docName, first: previewOf(ed), modified: Date.now() });
    // blank papers you aren't on are tidied away
    for (const p of papers.filter((p) => p.name !== docName && p.name.startsWith('paper-') && !p.first.trim())) files.remove(p.name);
    papers.splice(0, papers.length, ...papers.filter((p) => p.name === docName || !p.name.startsWith('paper-') || p.first.trim()));
    papers.sort((a, b) => b.modified - a.modified);
    grid.innerHTML = '';
    const plus = document.createElement('div');
    plus.className = 'pg new';
    plus.title = 'new paper';
    plus.innerHTML = '<img src="assets/icon-new.png" alt="new">';
    plus.onclick = async () => { await newPaper(); toggleBar(false); }; // straight to the blank paper, side bar closed
    for (const p of papers) {
      const el = document.createElement('div');
      el.className = 'pg' + (p.name === docName ? ' on' : '');
      const t = document.createElement('span');
      const blank = !p.first.trim();
      t.className = 't' + (blank ? ' blank' : '');
      t.textContent = blank ? 'untitled' : p.first.replace(/^[\s\u200b]+/, ''); // the words start at the top of the tiny page, whatever space is above them
      el.append(t);
      if (p.name !== 'page') { // the first paper stays
        const del = document.createElement('img');
        del.className = 'del';
        del.src = 'assets/icon-remove.png';
        del.alt = del.title = 'remove';
        del.onclick = (e) => { e.stopPropagation(); deletePaper(p, true); };
        el.append(del);
      }
      el.onclick = async () => { if (p.name !== docName) await openDoc(p.name); toggleBar(false); }; // straight to the paper, side bar closed
      el.oncontextmenu = (e) => { e.preventDefault(); pageMenu(e, p); };
      grid.append(el);
    }
    grid.append(plus);
    grid.querySelectorAll('.pg:not(.new) .t:not(.blank)').forEach(fitPreview);
  }

  // right-click on a tiny page: Duplicate, or Delete (to the Trash, so it can be got back)
  const menu = document.createElement('div');
  menu.id = 'pagemenu';
  document.body.append(menu);
  function pageMenu(e, p) {
    menu.innerHTML = '';
    const item = (label, fn) => { const b = document.createElement('div'); b.textContent = label; b.onclick = async (ev) => { ev.stopPropagation(); closeMenu(); await fn(); }; menu.append(b); };
    item('Duplicate', async () => {
      let body = await files.get(p.name);
      if (body.startsWith('<!--paper:md-->')) body = fromMarkdown(body.slice(15));
      if (p.name === docName) { saveDoc.flush(); body = ed.innerHTML; }
      const name = newName();
      files.put(name, body || '<p><br></p>');
      // its notes and to-dos come too
      if (p.name === docName) { saveNotes.flush(); saveTodos.flush(); }
      const [n, t] = await Promise.all([files.get('notes-' + p.name), files.get('todo-' + p.name)]);
      if (n.trim()) files.put('notes-' + name, n);
      if (t.trim()) files.put('todo-' + name, t);
      setTimeout(() => showPapers(true), 150);
    });
    if (p.name !== 'page') item('Delete', () => deletePaper(p));
    menu.style.left = Math.min(e.clientX, innerWidth - 130) + 'px';
    menu.style.top = Math.min(e.clientY, innerHeight - 70) + 'px';
    menu.classList.add('show');
  }
  // off the tiny pages: the X keeps it in ~/Paper/removed, Delete moves it to the Trash; either way it can be got back.
  // Taking off the paper you're on opens the most recent other one
  async function deletePaper(p, away) {
    await (away ? files.putAway(p.name) : files.trash(p.name));
    status(p.name.startsWith('file-') ? 'Taken off the list' : away ? 'Removed' : 'Moved to Trash'); // a file opened from Finder stays where it is
    if (p.name === docName) {
      const rest = (await files.list()).filter((x) => x.name !== p.name).sort((a, b) => b.modified - a.modified);
      await openDoc(rest[0]?.name || 'page');
    }
    setTimeout(() => showPapers(true), 150);
  }
  const closeMenu = () => menu.classList.remove('show');
  document.addEventListener('mousedown', (e) => { if (!menu.contains(e.target)) closeMenu(); }, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); }, true);

  // on the website, a first visit opens on a short note; it's ordinary text, delete it and it's gone
  const STARTER = '<p>A paper for writing.</p><p>Mouse over the right of the screen for visuals.</p>';

  // nothing written: no words and no list items
  const blankPage = () => !ed.textContent.replace(/[\s\u200b]/g, '') && !ed.querySelector('li, sup.fn') && !notesText().trim() && !todos.some((t) => t.t.trim());

  // this paper's own notes and to-dos; the first time, the old shared ones become the open paper's
  async function loadSide(name) {
    let [n, t] = await Promise.all([files.get('notes-' + name), files.get('todo-' + name)]);
    if (!n.trim() && !t.trim()) {
      // once: the old shared notes and to-dos move to this paper, and the shared files are emptied
      // (their last contents stay in .history), so no other paper or window picks them up again
      const [gn, gt] = await Promise.all([files.get('notes'), files.get('todo')]);
      if (gn.trim() || gt.trim()) {
        [n, t] = [gn, gt];
        if (n.trim()) files.put('notes-' + name, n);
        if (t.trim()) files.put('todo-' + name, t);
        files.put('notes', '');
        files.put('todo', '');
      }
    }
    setNotes(n);
    todos = parseTodos(t);
    todoUndo.length = 0;
    todoRedo.length = 0;
    renderTodos();
  }

  async function openDoc(name) {
    saveDoc.flush();
    saveNotes.flush(); // the paper you're leaving keeps its own notes and to-dos
    saveTodos.flush();
    if (docName && docName !== name && docName.startsWith('paper-') && blankPage()) files.remove(docName); // a blank paper you've left
    docName = name;
    s.current = name;
    local.set('settings', JSON.stringify(s));
    if (native) ask({ op: 'open', name });
    const firstVisit = onWeb && name === 'page' && local.get('file.' + name) == null;
    let body = await files.get(name);
    if (body.startsWith('<!--paper:md-->')) body = fromMarkdown(body.slice(15)); // a markdown file opened from Finder
    ed.innerHTML = body.trim() || (firstVisit ? STARTER : '<p><br></p>');
    plainSpaces(ed);
    tidyBlocks();
    await loadSide(name);
    retitle();
    recount();
    paginate();
    caretToEnd();
  }

  // spaces as plain spaces: the non-breaking ones a browser leaves behind become ordinary, and
  // line breaks from an HTML file's own layout become single spaces (the page keeps spaces as typed)
  function plainSpaces(root) {
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n; (n = walk.nextNode());) {
      const t = n.data.replace(/\u00a0/g, ' ').replace(/[ \t]*[\r\n]+[ \t]*/g, ' ');
      if (t !== n.data) n.data = t;
    }
    // text with nothing in it but layout, between paragraphs or list items, goes
    for (const n of [...root.childNodes]) if (n.nodeType === 3 && !n.data.trim()) n.remove();
    root.querySelectorAll('ul, ol').forEach((l) => [...l.childNodes].forEach((n) => { if (n.nodeType === 3 && !n.data.trim()) n.remove(); }));
  }

  function placeCaret(fn) {
    const r = document.createRange();
    fn(r);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
  function caretToEnd() {
    ed.focus({ preventScroll: true });
    placeCaret((r) => { r.selectNodeContents(ed.lastElementChild || ed); r.collapse(false); });
  }
  const caretAtStart = (el) => placeCaret((r) => { r.setStart(el, 0); r.collapse(true); });

  // a link whose words have all been deleted goes with them, and so does the invisible
  // space that kept the cursor outside it
  function tidyLinks() {
    // the browser copies styles onto what it inserts; the page has none of its own
    ed.querySelectorAll('[style]').forEach((el) => el.removeAttribute('style'));
    ed.querySelectorAll('span:not([class])').forEach((el) => el.replaceWith(...el.childNodes));
    for (const a of ed.querySelectorAll('a')) {
      if (a.textContent.replace(/\u200b/g, '')) continue;
      a.replaceWith(...[...a.childNodes].filter((n) => n.nodeName === 'BR'));
    }
    // an invisible space only belongs right after a link
    const walk = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
    const stray = [];
    for (let n; (n = walk.nextNode());) if (n.data.includes('\u200b')) stray.push(n);
    const sel = getSelection(), at = sel.rangeCount ? sel.getRangeAt(0) : null;
    for (const n of stray) {
      const afterLink = n.previousSibling?.nodeName === 'A' || !!n.previousSibling?.matches?.('sup.fn'); // after a link or a footnote, it's the cursor's place
      for (let k = n.data.length - 1; k >= 0; k--) {
        if (n.data[k] !== '\u200b' || (afterLink && k === 0)) continue;
        const keep = at && at.startContainer === n && at.startOffset > k;
        n.deleteData(k, 1);
        if (keep) placeCaret((x) => { x.setStart(n, Math.min(at.startOffset - 1, n.length)); x.collapse(true); });
      }
    }
  }
  ed.addEventListener('input', (e) => {
    tidyLinks();
    if (!ed.textContent && !ed.querySelector('li')) { ed.innerHTML = '<p><br></p>'; caretToEnd(); }
    recount();
    paginate();
    drawCaret();
    keepCaretUp();
    saveDoc();
  });

  // writing near the bottom of the window, the page moves up a few lines, so the line being written never sits on the edge
  function keepCaretUp() {
    requestAnimationFrame(() => {
      const sel = getSelection();
      if (!sel.rangeCount || !sel.isCollapsed || !ed.contains(sel.anchorNode)) return;
      const r = sel.getRangeAt(0);
      const lh = parseFloat(getComputedStyle(ed).lineHeight);
      const rects = r.getClientRects();
      let rect = rects[rects.length - 1];
      if (!rect || !rect.height) { // an empty line: measure the line itself
        const n = r.startContainer;
        rect = (n.nodeType === 1 ? n : n.parentElement).getBoundingClientRect();
        if (rect.height > lh * 2) return;
      }
      if (rect.bottom > innerHeight - lh * 3) scrollBy({ top: rect.bottom - (innerHeight - lh * 7), behavior: 'smooth' });
    });
  }

  // quotes and apostrophes curl as they're typed: let’s gets its ’ straight away, not once the s comes
  document.addEventListener('beforeinput', (e) => {
    if (e.inputType !== 'insertText' || (e.data !== "'" && e.data !== '"')) return;
    const field = e.target;
    if (!typingIn(field) || isBox(field)) return;
    const sel = getSelection();
    if (!sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    const n = r.startContainer;
    let from = n.nodeType === 3 && r.startOffset ? n : (n.nodeType === 3 ? n.parentElement : n).closest('p, li, div');
    if (!from || !field.contains(from)) from = field;
    const before = r.cloneRange();
    before.setStart(from, 0);
    const prev = before.toString().slice(-1);
    // after a space, a bracket, a dash or the start of a line it opens; after a letter it closes
    const opens = !prev || /[\s(\[{\u2014\u2013\u201c\u2018\/-]/.test(prev);
    e.preventDefault();
    document.execCommand('insertText', false, e.data === "'" ? (opens ? '\u2018' : '\u2019') : (opens ? '\u201c' : '\u201d'));
  }, true);

  // Safari can leave a strip between two lines unpainted as a selection is dragged across them: repaint the page once it changes
  let repaintFrame = 0, repaintFlip = false;
  document.addEventListener('selectionchange', () => {
    const sel = getSelection();
    if (!sel.rangeCount || sel.isCollapsed || !ed.contains(sel.anchorNode)) return;
    cancelAnimationFrame(repaintFrame);
    repaintFrame = requestAnimationFrame(() => {
      repaintFlip = !repaintFlip;
      ed.style.backgroundColor = repaintFlip ? 'rgba(255, 255, 255, 0)' : 'rgba(0, 0, 0, 0)'; // clear either way, but a change, so it all paints again
    });
  });

  // paste as plain text, so the page stays one voice; a link pasted over selected words links them
  ed.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = e.clipboardData.getData('text/plain');
    const html = e.clipboardData.getData('text/html');
    const url = text.trim();
    const isUrl = isUrlText(url);
    if (!html && !isUrlText(url) && looksLikeMarkdown(text)) { // markdown pasted as plain text: take its formatting
      const blocks = /\n\s*\n|^\s*([-*+]|\d+\.)\s|^#{1,6}\s|^\[\^/m.test(text);
      // whole paragraphs or lists pasted at the end of a line start on a new line, rather than joining it
      const c = caretContext();
      const md = document.createElement('div');
      md.innerHTML = fromMarkdown(text);
      if (blocks && intoItem(md)) return;
      if (blocks && c && c.before.trim() && getSelection().isCollapsed) document.execCommand('insertParagraph');
      document.execCommand('insertHTML', false, blocks ? fromMarkdown(text) : fromMarkdownInline(text));
      tidyLinks();
      tidyBlocks();

    }
    if (isUrl && !getSelection().isCollapsed) document.execCommand('createLink', false, toHref(url));
    else if (isUrl) { // an address pasted on its own becomes a link, so ⌘K shows it in the link box
      const a = document.createElement('a');

      document.execCommand('insertHTML', false, a.outerHTML + '&#8203;');

    }
    else if (html) {
      const clean = document.createElement('div');
      clean.innerHTML = cleanPaste(html);
      plainSpaces(clean);
      if (intoItem(clean)) return;
      // one paragraph's worth goes into the line where the cursor is, not onto a new line
      const one = clean.children.length === 1 && clean.firstElementChild.nodeName === 'P' && !clean.firstElementChild.previousSibling && !clean.firstElementChild.nextSibling;
      if (one && clean.querySelector('sup.fn')) {
        // with a footnote in it, put it in by hand: the browser's own insert misplaces uneditable pieces
        const sel = getSelection(), r = sel.getRangeAt(0);
        r.deleteContents();
        const frag = document.createDocumentFragment();
        frag.append(...clean.firstElementChild.childNodes);
        const last = frag.lastChild;
        r.insertNode(frag);
        placeCaret((x) => { x.setStartAfter(last); x.collapse(true); });
        ed.dispatchEvent(new Event('input')); // counts, pages, notes and saving, as for typing
      } else document.execCommand('insertHTML', false, one ? clean.firstElementChild.innerHTML : clean.innerHTML);
      ed.querySelectorAll('sup.fn').forEach((x) => x.setAttribute('contenteditable', 'false'));
      layoutNotes();
      ed.querySelectorAll('[style]').forEach((el) => el.removeAttribute('style'));
      ed.querySelectorAll('span:not([class])').forEach((el) => el.replaceWith(...el.childNodes));
      tidyBlocks();
    } else document.execCommand('insertText', false, text);
  });

  // keep the page's shape whole after a paste, and in papers a paste once left broken: list items only
  // inside a list, no paragraph inside a paragraph or a list item, and no paragraph with nothing at all
  // in it (it has no height, so it could never be clicked into)
  function tidyBlocks() {
    for (const p of [...ed.querySelectorAll('p p, li p')]) {
      if (p.textContent && p.previousSibling) p.before(document.createElement('br'));
      p.replaceWith(...p.childNodes);
    }
    for (const list of [...ed.querySelectorAll('p > ul, p > ol')]) { // a list inside a paragraph moves out after it
      const p = list.parentElement, rest = document.createElement('p');
      while (list.nextSibling) rest.append(list.nextSibling);
      p.after(list);
      if (rest.childNodes.length) list.after(rest);
    }
    const at = getSelection().anchorNode;
    for (const p of [...ed.querySelectorAll('p')]) {
      if (p.firstChild) continue;
      if (p.contains(at) || ed.children.length === 1) p.append(document.createElement('br'));
      else p.remove();
    }
    for (const li of [...ed.querySelectorAll('li')]) {
      if (/^(UL|OL)$/.test(li.parentElement.nodeName)) continue;
      let prev = li.previousSibling;
      while (prev && prev.nodeType === 3 && !prev.data.trim()) prev = prev.previousSibling;
      if (prev && /^(UL|OL)$/.test(prev.nodeName)) prev.append(li); // joins the list just above it
      else { const ul = document.createElement('ul'); li.before(ul); ul.append(li); }
    }
  }

  // a list pasted into a list item: each of its lines becomes an item of this list, never a list inside the item
  function intoItem(clean) {
    const n = getSelection().anchorNode, item = (n?.nodeType === 1 ? n : n?.parentElement)?.closest('li');
    if (!item || !ed.contains(item) || !clean.querySelector('li') || clean.querySelector('sup.fn')) return false;
    if (![...clean.children].every((n) => /^(P|UL|OL)$/.test(n.nodeName))) return false;
    const lines = [];
    for (const n of clean.children) {
      for (const x of n.nodeName === 'P' ? [n] : n.querySelectorAll('li')) {
        const c = x.cloneNode(true);
        c.querySelectorAll('ul, ol').forEach((l) => l.remove());
        if (c.textContent.trim()) lines.push(c.innerHTML);
      }
    }
    lines.forEach((h, k) => { if (k) document.execCommand('insertParagraph'); document.execCommand('insertHTML', false, h); });
    tidyLinks();
    tidyBlocks();
    return true;
  }

  function isUrlText(t) { return /^(https?:\/\/|mailto:)\S+$/.test(t) || /^www\.\S+\.\S+$/.test(t); }

  // reduce pasted HTML to what the page knows: paragraphs, lists, links, and b / i / u / s.
  // fonts, sizes and colours are dropped so it takes on the page's own look
  function cleanPaste(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const body = doc.body;
    const BLOCK = /^(P|DIV|H[1-6]|BLOCKQUOTE|PRE|SECTION|ARTICLE|HEADER|FOOTER|MAIN|ASIDE|TR|DT|DD|FIGCAPTION)$/;
    const DROP = /^(SCRIPT|STYLE|META|LINK|TITLE|HEAD|IMG|PICTURE|SVG|IFRAME|OBJECT|EMBED|VIDEO|AUDIO|CANVAS|BUTTON|INPUT|SELECT|TEXTAREA|NOSCRIPT|TEMPLATE)$/;
    const unwrap = (el) => el.replaceWith(...el.childNodes);
    const wrapIn = (el, tag) => { const w = doc.createElement(tag); el.before(w); w.append(el); return w; };

    // 1. turn every element into one the page knows, or unwrap it
    for (const el of [...body.querySelectorAll('*')]) {
      if (!el.isConnected) continue;
      const tag = el.nodeName;
      if (DROP.test(tag)) { el.remove(); continue; }
      if (tag === 'SUP' && el.classList.contains('fn')) { // a footnote copied from Paper: it stays a footnote, with a fresh id
        const fresh = doc.createElement('sup');
        fresh.className = 'fn';
        fresh.setAttribute('contenteditable', 'false');
        fresh.setAttribute('data-note', el.getAttribute('data-note') || '');
        el.replaceWith(fresh);
        continue;
      }
      const style = el.getAttribute('style') || '';
      const weight = (style.match(/font-weight\s*:\s*(\w+)/i) || [])[1];
      const marks = [];
      const boldTag = tag === 'B' || tag === 'STRONG';
      if (boldTag ? !(weight && /^(normal|[1-5]00)$/i.test(weight)) : weight && /^(bold|bolder|[6-9]00)$/i.test(weight)) marks.push('b');
      if (tag === 'I' || tag === 'EM' || /font-style\s*:\s*italic/i.test(style)) marks.push('i');
      if ((tag === 'U' || /text-decoration[^;]*underline/i.test(style)) && !el.closest('a')) marks.push('u'); // links are already underlined
      if (/^(S|STRIKE|DEL)$/.test(tag) || /text-decoration[^;]*line-through/i.test(style)) marks.push('s');

      let keep = null;
      if (BLOCK.test(tag)) keep = 'p';
      else if (tag === 'UL' || tag === 'OL' || tag === 'LI' || tag === 'BR') keep = tag.toLowerCase();
      else if (tag === 'A' && /^(https?:|mailto:)/i.test(el.getAttribute('href') || '')) keep = 'a';

      const href = el.getAttribute('href');
      let node = el;
      if (keep) {
        const fresh = doc.createElement(keep);
        if (keep === 'a') fresh.setAttribute('href', href);
        fresh.append(...el.childNodes);
        el.replaceWith(fresh);
        node = fresh;
      }
      // inline marks go inside blocks, around the contents
      if (marks.length) {
        const inner = doc.createElement(marks[0]);
        let deepest = inner;
        for (const m of marks.slice(1)) { const x = doc.createElement(m); deepest.append(x); deepest = x; }
        if (keep && keep !== 'a') { deepest.append(...node.childNodes); node.append(inner); }
        else { node.before(inner); deepest.append(node); }
      }
      if (!keep) unwrap(node);
    }

    // 2. fix nesting: no paragraphs inside paragraphs or list items, no blocks inside bold/italic
    for (const el of [...body.querySelectorAll('b, i, u, s, a')]) {
      if (el.querySelector('p, ul, ol, li')) unwrap(el);
    }
    for (const p of [...body.querySelectorAll('p')]) if (p.querySelector('ul, ol, li')) unwrap(p); // a list never sits inside a paragraph
    for (const p of [...body.querySelectorAll('p')]) {
      if (p.parentElement && p.parentElement.closest('p, li')) {
        if (p.previousSibling) p.before(doc.createElement('br'));
        unwrap(p);
      }
    }
    // list items copied without their list (part of a list, copied from Paper) get one back
    for (const li of [...body.querySelectorAll('li')]) {
      if (/^(UL|OL)$/.test(li.parentElement.nodeName)) continue;
      const prev = li.previousElementSibling;
      if (prev?.nodeName === 'UL' && li.previousSibling === prev) prev.append(li);
      else wrapIn(li, 'ul');
    }
    for (const list of [...body.querySelectorAll('ul, ol')]) {
      for (const n of [...list.childNodes]) {
        if (n.nodeName === 'LI' || n.nodeName === 'UL' || n.nodeName === 'OL') continue;
        if (n.nodeType === 3 && !n.data.trim()) { n.remove(); continue; }
        wrapIn(n, 'li');
      }
    }
    // loose text and inline bits at the top level become paragraphs
    let run = null;
    for (const n of [...body.childNodes]) {
      const block = n.nodeType === 1 && /^(P|UL|OL)$/.test(n.nodeName);
      if (block || (n.nodeType === 3 && !n.data.trim() && !run)) { run = null; if (!block) n.remove(); continue; }
      if (n.nodeName === 'BR' && run) { run = null; n.remove(); continue; }
      if (!run) { run = doc.createElement('p'); n.before(run); }
      run.append(n);
    }
    // collapse source-code whitespace, and drop empty marks
    const walker = doc.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    for (let t = walker.nextNode(); t; t = walker.nextNode()) t.data = t.data.replace(/[ \t\r\n]+/g, ' ');
    for (const el of [...body.querySelectorAll('b, i, u, s')]) if (!el.textContent && !el.querySelector('sup')) el.remove();
    return body.innerHTML;
  }

  /* ---------- the cursor ---------- */
  const caretMark = $('caret');
  let caretFrame = 0;
  const metricsCache = new Map();
  function typeMetrics(cs, fs) {
    const key = cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily;
    if (!metricsCache.has(key)) {
      const c = document.createElement('canvas').getContext('2d');
      c.font = key;

    todos.forEach((td, i) => {
      const li = document.createElement('li');
      li.classList.toggle('done', td.d);
      li.innerHTML = CHECK;
      const check = li.querySelector('.check');
      check.contentEditable = 'false';
      const hand = tickHand(i + ':' + td.t);
      check.insertAdjacentHTML('beforeend', tickSvg(hand.which));
      check.querySelector('svg').style.transform = hand.transform;
      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = td.t;
      text.append(document.createElement('br')); // somewhere for the cursor on an empty line, and after a final line break
      li.append(text);
      check.onmousedown = (e) => e.preventDefault(); // keep the selection, so a click can tick several
      check.onclick = () => toggleDone(i);
      list.append(li);
    });
    fitBoxes();
    list.querySelectorAll('.check img').forEach((img) => img.addEventListener('load', fitBoxes, { once: true }));
    if (focusAt != null) focusTodo(focusAt, atStart ? 0 : null);
  }

  // tick one to-do, or every to-do in a selection that runs across several
  function toggleDone(i) {
    const sel = todoSel();
    const span = sel && !sel.collapsed && sel.a.i !== sel.b.i && i >= sel.a.i && i <= sel.b.i ? [sel.a.i, sel.b.i] : [i, i];
    const to = !todos[i].d;
    for (let k = span[0]; k <= span[1]; k++) {
      if (todos[k].d === to) continue;
      todos[k].d = to;
      const li = list.children[k];
      li.classList.toggle('done', to);
      const pen = li.querySelector('.check svg path');
      pen.classList.remove('go');
      if (to) { void pen.getBoundingClientRect(); pen.classList.add('go'); }
      strikeThrough(li);
    }
    saveTodos();
  }

  // where a point in the list is: which to-do, and how many characters in
  function todoPos(node, offset) {
    let li = (node.nodeType === 1 ? node : node.parentElement)?.closest('li');
    if (!li || !list.contains(li)) {
      if (node !== list) return null;
      const n = list.children.length;
      li = list.children[Math.min(offset, n - 1)];
      const i = [...list.children].indexOf(li);
      return { i, off: offset >= n ? todos[i].t.length : 0 };

    const len = text.textContent.length;
    if (text.contains(node)) {

      r.selectNodeContents(text);
      r.setEnd(node, offset);
      return { i, off: Math.min(r.toString().length, len) };

    return { i, off: before ? 0 : len };

  function todoSel() {

    const r = sel.getRangeAt(0);
    const a = todoPos(r.startContainer, r.startOffset), b = todoPos(r.endContainer, r.endOffset);

    list.focus({ preventScroll: true });

  function focusTodo(i, off) {
    setTodoSel({ i, off: off == null ? todos[i].t.length : off });

  // undo and redo for the list, since Paper edits it itself
  const todoUndo = [], todoRedo = [];
  let lastSnap = 0;
  function remember(typing) {
    const now = Date.now();

  function restore(from, to) {

    saveTodos();

  // take out everything between two points, joining what's left of the first and last to-do
  function cutSpan(a, b) {
    if (a.i === b.i) { todos[a.i].t = todos[a.i].t.slice(0, a.off) + todos[a.i].t.slice(b.off); return; }

  }
  // put text in at a point: each new line of it becomes a new to-do ("- [ ]" and "- " are taken off)
  function putText(a, text) {
    const lines = text.replace(/\r\n?/g, '\n').split('\n').map((l, k) => k || a.off === 0 ? l.replace(/^\s*(?:[-*+]\s+)?(?:\[[ xX]\]\s*)?/, '') : l);
    const td = todos[a.i], rest = td.t.slice(a.off);

    td.t = td.t.slice(0, a.off) + lines[0];
    const more = lines.slice(1).map((t) => ({ t, d: false }));
    more[more.length - 1].t += rest;

  }
  const selectedText = (sel) => {
    const parts = [];
    for (let k = sel.a.i; k <= sel.b.i; k++) parts.push(todos[k].t.slice(k === sel.a.i ? sel.a.off : 0, k === sel.b.i ? sel.b.off : undefined));

  };
  function redraw(at) {
    renderTodos();
    saveTodos();
    setTodoSel(at);
  }

  list.addEventListener('beforeinput', (e) => {
    const t = e.inputType;
    if (t === 'historyUndo') { e.preventDefault(); return restore(todoUndo, todoRedo); }
    if (t === 'historyRedo') { e.preventDefault(); return restore(todoRedo, todoUndo); }
    if (t.startsWith('format')) return e.preventDefault(); // to-dos are plain text
    const sel = todoSel();
    if (!sel) return e.preventDefault();
    const { a, b } = sel;
    const across = a.i !== b.i;

    if (t === 'insertParagraph') { // enter: a new to-do with the rest of the line
      e.preventDefault(); remember();
      cutSpan(a, b);
      const td = todos[a.i];
      const rest = td.t.slice(a.off).replace(/^[\n ]+/, '');
      td.t = td.t.slice(0, a.off).replace(/\n+$/, '');
      todos.splice(a.i + 1, 0, { t: rest, d: false });
      return redraw({ i: a.i + 1, off: 0 });
    }
    if (t === 'insertLineBreak') { // shift-enter: a new line inside the to-do
      e.preventDefault(); remember();
      cutSpan(a, b);
      const td = todos[a.i];
      td.t = td.t.slice(0, a.off) + '\n' + td.t.slice(a.off);
      return redraw({ i: a.i, off: a.off + 1 });
    }
    if (t === 'insertFromPaste' || t === 'insertFromDrop' || t === 'insertReplacementText' && across) {
      e.preventDefault(); remember();
      const text = e.dataTransfer?.getData('text/plain') ?? e.data ?? '';
      cutSpan(a, b);
      return redraw(putText(a, text));
    }
    if (t.startsWith('delete')) {
      const back = /Backward$/.test(t) || t === 'deleteByCut' || t === 'deleteByDrag' || t === 'deleteContent';
      if (!sel.collapsed) {
        if (!across) { remember(true); return; } // inside one to-do, the browser does it
        e.preventDefault(); remember();
        cutSpan(a, b);
        return redraw(a);
      }
      if (back && a.off === 0) { // at the start of a to-do: join it to the one above
        e.preventDefault();
        if (a.i === 0) return;
        remember();
        const prev = todos[a.i - 1], at = prev.t.length;
        prev.t += todos[a.i].t;
        todos.splice(a.i, 1);
        return redraw({ i: a.i - 1, off: at });
      }
      if (!back && a.off === todos[a.i].t.length) { // at the end: bring the next one up
        e.preventDefault();
        if (a.i === todos.length - 1) return;
        remember();
        todos[a.i].t += todos[a.i + 1].t;
        todos.splice(a.i + 1, 1);

      return;
    }
    if (across && (t === 'insertText' || t === 'insertCompositionText')) { // typing over a selection across to-dos

      return redraw(putText(a, e.data || ''));
    }
